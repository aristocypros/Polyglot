[package]
name = "pe-sim"
version = "0.1.0"
edition = "2021"

[dependencies]
signer = { path = "../../signer" }
serde = { version = "=1.0.219", features = ["derive"] }
serde_json = "=1.0.140"
serde_yaml = "=0.9.34"
base64ct = { version = "=1.8.3", features = ["alloc"] }
ed25519-dalek = { version = "=2.1.1", features = ["serde", "rand_core", "zeroize", "pkcs8"] }
p256 = { version = "=0.13.2", features = ["ecdsa", "pkcs8", "sha256"] }
sha2 = "=0.10.8"
hex = "=0.4.3"
chrono = { version = "0.4", features = ["serde", "clock"] }
uuid = { version = "1.10", features = ["v4"] }
k256 = { version = "=0.13.4", features = ["arithmetic", "ecdsa", "schnorr"] }
bs58 = "=0.5.1"
sha3 = "=0.10.8"

